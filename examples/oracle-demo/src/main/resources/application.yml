spring:
  main:
    web-application-type: none
  datasource:
    url: ${ORACLE_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
    username: ${ORACLE_USERNAME}
    password: ${ORACLE_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 12
  batch:
    jdbc:
      initialize-schema: never
    job:
      name: customerJob
batch:
  parallel:
    sql:
      base-path: classpath:sql/
    max-workers: 4
    queue-capacity: 16
    jobs:
      customerJob:
        concurrency: 3
logging:
  pattern:
    level: '%5p [job=%X{batchJob} partition=%X{batchPartition} value=%X{batchPartitionValue}]'
