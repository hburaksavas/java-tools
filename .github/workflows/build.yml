name: Java 17 build
on:
  push:
    branches: ['project/spring-batch-parallel-starter']
  pull_request:
    branches: ['project/spring-batch-parallel-starter']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - name: Verify runnable example compiles
        run: ./mvnw -B install -DskipTests && ./mvnw -B -f examples/oracle-demo/pom.xml package
      - name: Run SQL example in Oracle compatibility mode
        run: java -jar examples/oracle-demo/target/parallel-oracle-demo-0.1.0-SNAPSHOT.jar --spring.profiles.active=h2
