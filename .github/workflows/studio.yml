name: Verify and release Swagger UI Studio
on:
  push:
    branches: ['project/swagger-ui-studio']
    tags: ['swagger-ui-studio-v*']
  pull_request:
    branches: ['project/swagger-ui-studio']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci && npm run check && npm test
      - run: chmod +x mvnw && ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        with:
          name: swagger-ui-studio-0.3.14
          path: |
            spring-boot-starter/target/*.jar
            examples/customer-api/target/*.jar
  release:
    if: startsWith(github.ref, 'refs/tags/swagger-ui-studio-v')
    needs: verify
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build Maven distribution
        run: |
          chmod +x mvnw
          ./mvnw -B deploy -DskipTests -DaltDeploymentRepository=studio-release::file:${{ runner.temp }}/studio-maven
          mkdir -p dist
          cp spring-boot-starter/target/*.jar dist/
          cp examples/customer-api/target/swagger-ui-studio-customer-demo-0.3.14.jar dist/
          (cd "${{ runner.temp }}/studio-maven" && zip -qr "$GITHUB_WORKSPACE/dist/swagger-ui-studio-0.3.14-maven-repository.zip" .)
          (cd dist && sha256sum *.jar *.zip > SHA256SUMS.txt)
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "Swagger UI Studio 0.3.14" --notes-file RELEASE_NOTES.md
